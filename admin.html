<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · MyCraftingAI</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .adm-wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }
    .adm-top { display: flex; align-items: center; gap: 14px; margin: 10px 0 26px; }
    .adm-top .brand { font-size: 18px; }
    .adm-badge { font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #b9c2ff; background: rgba(79,99,245,.16); border: 1px solid var(--accent); padding: 5px 9px; border-radius: 7px; }
    .adm-who { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
    .adm-gate { max-width: 460px; margin: 90px auto; text-align: center; }
    .adm-gate h1 { font: 700 26px var(--display); }
    .adm-gate p { color: var(--muted); margin: 14px 0 24px; }
    .adm-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
    .adm-card { background: var(--surface); border: 1px solid var(--rim); border-radius: var(--radius); padding: 18px; }
    .adm-card .k { font: 500 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .adm-card .v { font: 700 30px var(--display); margin-top: 8px; letter-spacing: -.01em; }
    .adm-card .s { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .adm-section { margin-top: 30px; }
    .adm-section h2 { font: 600 15px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; }
    .adm-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .adm-pill { border: 1px solid var(--rim); background: rgba(255,255,255,.02); border-radius: 999px; padding: 7px 14px; font-size: 14px; color: var(--muted); }
    .adm-pill b { color: var(--text); }
    .adm-controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .adm-controls .input { height: 42px; flex: 1; min-width: 220px; }
    .adm-controls select.input { flex: 0 0 auto; width: auto; }
    .adm-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--rim); border-radius: var(--radius); overflow: hidden; }
    .adm-table th { text-align: left; font: 600 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 12px 14px; border-bottom: 1px solid var(--rim); }
    .adm-table td { padding: 13px 14px; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 14px; }
    .adm-table tr:last-child td { border-bottom: none; }
    .adm-table tbody tr { cursor: pointer; }
    .adm-table tbody tr:hover { background: rgba(255,255,255,.03); }
    .adm-u { display: flex; flex-direction: column; }
    .adm-u .em { color: var(--muted); font-size: 12.5px; }
    .adm-tag { font: 600 11px var(--mono); padding: 3px 8px; border-radius: 6px; display: inline-block; }
    .adm-tag.free { background: rgba(255,255,255,.06); color: var(--muted); }
    .adm-tag.paid { background: rgba(79,99,245,.16); color: #b9c2ff; }
    .adm-tag.off { background: rgba(255,120,120,.14); color: #ff9a9d; }
    .adm-tag.adm { background: rgba(120,220,160,.14); color: #9ff0c7; }
    .adm-bar { height: 6px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 6px; max-width: 160px; }
    .adm-bar > i { display: block; height: 100%; background: var(--accent); }
    .adm-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 14px; }
    .adm-foot .spacer { flex: 1; }
    .adm-empty { padding: 40px; text-align: center; color: var(--muted); }
    .drawer-back { position: fixed; inset: 0; background: rgba(4,4,8,.6); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 50; }
    .drawer-back.show { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(460px, 94vw); background: var(--bg); border-left: 1px solid var(--rim); transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.7,.2,1); z-index: 51; overflow-y: auto; padding: 24px; }
    .drawer.show { transform: none; }
    .drawer h3 { font: 700 20px var(--display); }
    .drawer .em { color: var(--muted); font-size: 14px; margin-top: 2px; word-break: break-all; }
    .drawer .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
    .drawer .row span { color: var(--muted); }
    .drawer .block { margin-top: 22px; }
    .drawer .block h4 { font: 600 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; }
    .drawer .field { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .drawer .field label { flex: 1; font-size: 14px; }
    .drawer .actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-danger { background: rgba(255,90,90,.14); border-color: rgba(255,90,90,.4); color: #ff9a9d; }
    .btn-danger:hover { background: rgba(255,90,90,.22); color: #fff; }
    .spark { display: flex; align-items: flex-end; gap: 3px; height: 54px; margin-top: 4px; }
    .spark > i { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface); border: 1px solid var(--rim); border-radius: 10px; padding: 12px 18px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 60; }
    .toast.show { opacity: 1; transform: translateX(-50%); }
    .toast.err { border-color: rgba(255,90,90,.5); color: #ff9a9d; }
  </style>
</head>
<body data-page="admin">
  <div class="adm-wrap">
    <div class="adm-top">
      <a class="brand" href="index.html">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#4F63F5"/><g fill="#fff"><rect x="14" y="6" width="4" height="4"/><rect x="14" y="10" width="4" height="4"/><rect x="6" y="14" width="4" height="4"/><rect x="10" y="14" width="4" height="4"/><rect x="18" y="14" width="4" height="4"/><rect x="22" y="14" width="4" height="4"/><rect x="14" y="18" width="4" height="4"/><rect x="14" y="22" width="4" height="4"/></g></svg>
        MyCraftingAI
      </a>
      <span class="adm-badge">Admin</span>
      <div class="adm-who" data-who hidden>
        <span data-who-name></span>
        <button class="btn btn-ghost" data-signout>Sign out</button>
      </div>
    </div>

    <div class="adm-gate" data-gate hidden>
      <h1 data-gate-title>Checking your access…</h1>
      <p data-gate-sub>One moment.</p>
      <a class="btn btn-primary btn-lg" data-gate-action hidden></a>
    </div>

    <main data-panel hidden>
      <div class="adm-cards" data-cards></div>
      <div class="adm-section">
        <h2>Plans</h2>
        <div class="adm-pills" data-plans></div>
      </div>
      <div class="adm-section">
        <h2>Users</h2>
        <div class="adm-controls">
          <input class="input" type="search" placeholder="Search email or username…" data-search autocomplete="off">
          <select class="input" data-plan-filter>
            <option value="">All plans</option>
          </select>
        </div>
        <table class="adm-table">
          <thead><tr><th>User</th><th>Plan</th><th>Today</th><th>Status</th><th>Joined</th></tr></thead>
          <tbody data-rows></tbody>
        </table>
        <div class="adm-foot">
          <button class="btn btn-ghost" data-prev>← Prev</button>
          <span data-page-info></span>
          <button class="btn btn-ghost" data-next>Next →</button>
          <span class="spacer"></span>
          <span data-total></span>
        </div>
      </div>
    </main>
  </div>

  <div class="drawer-back" data-drawer-back></div>
  <aside class="drawer" data-drawer></aside>
  <div class="toast" data-toast></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/plans.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
