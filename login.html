<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - MyCraftingAI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="login">
  <div class="auth">
    <aside class="auth-side" data-auth-side></aside>
    <main class="auth-main">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="sub" data-desktop-hint>Sign in to see your plan and today's tokens.</p>
        <form class="form" id="login-form" novalidate>
          <div class="notice" data-notice role="status"></div>
          <button class="btn btn-google btn-block btn-lg" type="button" data-google>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            Continue with Google
          </button>
          <div class="divider">or with email</div>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" required>
            <div class="err" data-err="email"></div>
          </div>
          <div class="field">
            <label for="password">Password <a href="forgot.html">Forgot?</a></label>
            <div class="input-wrap">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
              <button class="reveal-pw" type="button" aria-label="Show password">show</button>
            </div>
            <div class="err" data-err="password"></div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
        </form>
        <p class="auth-foot">New here? <a href="signup.html" data-keep-next>Create a free account</a></p>
      </div>
    </main>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/plans.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
