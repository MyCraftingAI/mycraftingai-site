<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account - MyCraftingAI</title>
  <meta name="description" content="Create a free MyCraftingAI account: 10,000 tokens every day to try the Mod Assistant.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=20261123">
</head>
<body data-page="signup">
  <div class="auth">
    <aside class="auth-side" data-auth-side></aside>
    <main class="auth-main">
      <div class="auth-card">
        <!-- Step 1: account details -->
        <section data-step="details">
          <h1>Create your account</h1>
          <p class="sub" data-plan-hint>Free plan: 10,000 new tokens a day. No card needed.</p>
          <form class="form" id="signup-form" novalidate>
            <div class="notice" data-notice role="status"></div>
            <button class="btn btn-google btn-block btn-lg" type="button" data-google>
              <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
              Sign up with Google
            </button>
            <div class="divider">or with email</div>
            <div class="field">
              <label for="name">Username</label>
              <input class="input" id="name" name="name" autocomplete="username" maxlength="32" required>
              <div class="err" data-err="name"></div>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input class="input" id="email" name="email" type="email" autocomplete="email" required>
              <div class="err" data-err="email"></div>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="input-wrap">
                <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>
                <button class="reveal-pw" type="button" aria-label="Show password">show</button>
              </div>
              <div class="pw-meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
              <div class="pw-hint" data-pw-hint>At least 8 characters, with a letter and a number.</div>
              <div class="err" data-err="password"></div>
            </div>
            <label class="check"><input type="checkbox" id="terms" required> <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span></label>
            <div class="err" data-err="terms" style="margin-top:-8px"></div>
            <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
          </form>
          <p class="auth-foot">Already have an account? <a href="login.html" data-keep-next>Sign in</a></p>
        </section>

        <!-- Step 2: 6-digit email code -->
        <section data-step="verify" hidden>
          <h1>Check your inbox</h1>
          <p class="sub">We sent a 6-digit code to <b data-email-echo></b>. It expires in 15 minutes.</p>
          <form class="form" id="verify-form" novalidate>
            <div class="notice" data-notice role="status"></div>
            <div class="code-inputs" data-code>
              <input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 1" autocomplete="one-time-code">
              <input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 2">
              <input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 3">
              <input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 4">
              <input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 5">
              <input class="input" inputmode="numeric" maxlength="1" aria-label="Digit 6">
            </div>
            <button class="btn btn-primary btn-block btn-lg" type="submit">Verify email</button>
            <button class="btn btn-ghost btn-block" type="button" data-resend>Send a new code</button>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/plans.js"></script>
  <script src="assets/js/api.js?v=20261124"></script>
  <script src="assets/js/ui.js?v=20261124"></script>
  <script src="assets/js/auth.js?v=20261124"></script>
</body>
</html>
